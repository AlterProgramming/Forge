name: Qwen3 Blind Cross-Family Validation
on:
  push:
    branches:
      - research/qwen3-blind-transfer-20261114
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        family: [gsm8k, arc, mbpp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve only the formerly inspected prompts for disjointness filter
        uses: actions/download-artifact@v4
        with:
          run-id: 43626802957
          name: qwen3-cross-domain-trial
          path: prior_traces
          github-token: ${{ github.token }}
      - name: Install CPU Qwen3 and independent test benchmarks
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' accelerate safetensors 'datasets>=3,<5'
      - name: Verify frozen protocol and excluded input set
        run: |
          test -s prior_traces/cross_domain_results.json
          python experiments/qwen3-context-rewrite/cross-domain/blind_validate.py --self-test
          python experiments/qwen3-context-rewrite/cross-domain/force_complete.py --self-test
      - name: Measure plain / native thinking / forced completion on new questions
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/blind_validate.py \
            --family ${{ matrix.family }} --n 6 --seed 20261115 \
            --prior prior_traces/cross_domain_results.json \
            --model Qwen/Qwen3-0.6B \
            --output blind_${{ matrix.family }}.json
      - name: Preserve all scores, traces, tokens and partial output on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-blind-${{ matrix.family }}
          path: blind_${{ matrix.family }}.json
          if-no-files-found: warn
