name: Forge Arena G5 - verify published game matches Kairos Studio bytes
on:
  push:
    branches: [execution/qwen-real-inference-20261115]
    paths:
      - .github/workflows/verify-forge-arena-release.yml
      - deliveries/forge-arena/final/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  byte-for-byte-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare published final game to G2 and G3 attested output
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          game=Path('deliveries/forge-arena/final/index.html')
          raw=game.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          expected='d7dd64cadb49dc9df1c077381860592f876289d5cd4389489853f665262723d2'
          assert sha==expected, f'Published game does not match executed Kairos and Studio output: {sha} != {expected}'
          assert b'id="pause-btn"' in raw and b'function begin()' in raw
          print('GAME_GATE_G5_PUBLISHED_BYTES_MATCH', sha, len(raw))
          PY
      - name: Preserve matching playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: forge-arena-published-verified
          path: deliveries/forge-arena/final/index.html
