name: Qwen3 Minimal Communication Causality
on:
  push:
    branches: [research/qwen3-message-causality-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        family: [gsm8k, arc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen pretrained Qwen3-0.6B and public test data
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' accelerate safetensors 'datasets>=3,<5'
      - name: Verify signal manipulations and numeric scoring
        run: |
          python experiments/qwen3-context-rewrite/cross-domain/message_causality.py --self-test
      - name: Send, truncate, replace and drop intermediate Qwen messages
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/message_causality.py \
            --family ${{ matrix.family }} --n 6 --seed 20261116 \
            --model Qwen/Qwen3-0.6B \
            --sender-tokens 40 --receiver-tokens 112 \
            --output message_${{ matrix.family }}.json
      - name: Preserve all messages, responses, causal controls, and token costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-message-${{ matrix.family }}
          path: message_${{ matrix.family }}.json
          if-no-files-found: warn
