name: Qwen from durable Git checkpoint cold start
on:
  push:
    branches: [main]
    paths:
      - "scripts/qwen_recovery_smoke.py"
      - ".github/workflows/qwen-durable-cold-start.yml"
      - "models/qwen3-0.6b-communication-lora-v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify git-hosted actual LoRA checkpoint without network
        run: |
          python3 scripts/qwen_recovery_smoke.py --self-test
      - name: Install official CPU Qwen inference and PEFT
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.13,<1' accelerate safetensors
      - name: Fresh agent executes pretrained Qwen plus git-hosted trained LoRA, no old artifacts
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u scripts/qwen_recovery_smoke.py --limit 4 --out qwen_cold_start.json
      - name: Retain fresh-execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-durable-cold-start-proof
          path: qwen_cold_start.json
          if-no-files-found: warn
