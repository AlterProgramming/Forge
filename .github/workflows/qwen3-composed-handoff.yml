name: Qwen3 Verified Primitive Composition
on:
  push:
    branches: [research/qwen3-protocol-composition-proof-20261115]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-learned-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch real trained Qwen adapter from verified continued training
        uses: actions/download-artifact@v4
        with:
          name: qwen3-0_6b-continued-protocol-lora
          repository: AlterProgramming/Forge
          run-id: 43657885404
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous
      - name: Install unchanged pretrained Qwen and PEFT
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.13,<1' accelerate safetensors
      - name: Assert original held-out combinations and exact data interfaces
        run: |
          python experiments/qwen3-context-rewrite/cross-domain/composed_handoff_demo.py --self-test
      - name: Execute joint/atomic Qwen sender -> Qwen receiver -> base Qwen arithmetic
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/composed_handoff_demo.py \
            --model Qwen/Qwen3-0.6B --adapter previous/adapter \
            --out compositional_handoff_results.json
      - name: Archive every model-produced message, recipient state and computed answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-actual-compositional-handoffs
          path: compositional_handoff_results.json
          if-no-files-found: warn
