name: Qwen3 Cross-Domain Improvement Trial
on:
  push:
    branches:
      - research/qwen3-cross-domain-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen3 CPU and public benchmarks
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' accelerate safetensors 'datasets>=3,<5'
      - name: Verify protocol without model weights
        run: |
          python experiments/qwen3-context-rewrite/cross-domain/boost.py --self-test
      - name: Evaluate frozen Qwen3 on independent tasks
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/boost.py \
            --model Qwen/Qwen3-0.6B \
            --n 4 --k 3 --seed 20261114 --max-tokens 160 \
            --output cross_domain_results.json
      - name: Upload all generations, decisions, and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-cross-domain-trial
          path: cross_domain_results.json
          if-no-files-found: warn
