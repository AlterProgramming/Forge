name: Qwen3 Actual Communication Adapter Training
on:
  push:
    branches: [research/qwen3-protocol-grokking-lora-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-qwen-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen Qwen3 pretrained model plus actual PEFT training support
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.13,<1' accelerate safetensors 'datasets>=3,<5'
      - name: Verify the exact held-out split and protocol supervision
        run: |
          python experiments/qwen3-context-rewrite/cross-domain/train_protocol_lora.py --self-test
      - name: Update Qwen3-0.6B LoRA weights and execute held-out tests
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/train_protocol_lora.py \
            --model Qwen/Qwen3-0.6B \
            --seed 20261114 \
            --steps 384 --eval-every 96 --lr 0.0015 \
            --max-time-sec 2150 --out qwen_protocol_training
      - name: Persist ACTUAL trained LoRA tensor weights, tokenizer-independent PEFT config and all evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-0_6b-trained-communication-lora
          path: qwen_protocol_training/
          if-no-files-found: warn
          retention-days: 90
