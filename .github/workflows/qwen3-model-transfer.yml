name: Export Qwen3 weights as small artifacts
on:
  push:
    branches:
      - research/qwen3-context-rewrite-cpu-20261113
    paths:
      - .github/workflows/qwen3-model-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model downloader
        run: python -m pip install huggingface_hub
      - name: Download and partition official public model
        run: python -u experiments/qwen3-context-rewrite/export_checkpoint.py
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-weight-manifest
          path: transfer/manifest.json
          retention-days: 1
      - name: Upload shard 000
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-weight-shard-000
          path: transfer/shards/part-000
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload shard 001
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-weight-shard-001
          path: transfer/shards/part-001
