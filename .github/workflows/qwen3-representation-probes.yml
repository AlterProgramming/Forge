name: Qwen3 Arithmetic Representation Recovery
on:
  push:
    branches: [research/qwen3-representation-probes-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' accelerate safetensors
      - name: Numeric diagnostics self-test
        run: python experiments/qwen3-context-rewrite/cross-domain/micro_repr_probe.py --self-test
      - name: Test language, equations, and code-style representations
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/micro_repr_probe.py \
            --model Qwen/Qwen3-0.6B --output micro_repr_results.json
      - name: Archive every prompt and complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-arithmetic-representation-traces
          path: micro_repr_results.json
          if-no-files-found: warn
