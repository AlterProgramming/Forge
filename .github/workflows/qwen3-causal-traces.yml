name: Qwen3 Causal Trace and Reachability
on:
  push:
    branches: [research/qwen3-causal-traces-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model and original public dataset
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.51,<5' accelerate safetensors 'datasets>=3,<5'
      - name: Check causal intervention annotations
        run: |
          python experiments/qwen3-context-rewrite/cross-domain/trace_probe.py --self-test
      - name: Probe four original failed problems with fixed model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u experiments/qwen3-context-rewrite/cross-domain/trace_probe.py \
             --model Qwen/Qwen3-0.6B \
             --seed 20261115 --max-tokens 112 --micro-tokens 48 \
             --output causal_trace_results.json
      - name: Preserve every conditional prompt and Qwen response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-causal-traces
          path: causal_trace_results.json
          if-no-files-found: warn
